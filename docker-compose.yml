services:
  app:
    build: .
    image: dv2-app:latest
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm start"
    ports:
      - "${HOST_PORT:-3001}:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/myapp
      MONGODB_DB: myapp
      PORT: 3000
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
